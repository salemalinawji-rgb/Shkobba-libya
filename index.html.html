
<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>شكّوبة ليبية — PWA</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">
<header>
<h1>شكّوبة ليبية</h1>
<div class="controls">
<label>عدد اللاعبين:
<select id="playersSelect">
<option value="2">2 لاعبين (أنت + AI)</option>
<option value="4">4 لاعبين (أنت + 3 AI)</option>
</select>
</label>
<button id="newGame">جولة جديدة</button>
</div>
</header>
<main>
<section class="table-area">
<h2>الطاولة</h2>
<div id="tableCards" class="cards-row"></div>
</section>
<section class="players-area">
<div id="playersContainer"></div>
</section>
<section class="status">
<div id="statusText">اضغط "جولة جديدة" للبدء.</div>
<div id="scores"></div>
</section>
</main>
<footer>
<small>نسخة تدريبية — قواعد مبسّطة للـ "شكّوبة الليبية".</small>
</footer>
</div>
<script src="app.js"></script>
</body>
</html>
